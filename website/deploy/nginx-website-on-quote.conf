# The public website on quote.sensoper.in, next to the ERP — until sensoper.in's DNS points at this server.
# Don't edit /etc/nginx/snippets/sensoper-website-on-quote.conf by hand: website/deploy/enable-on-quote.sh copies
# this file there (with the backend's port) and includes it in the quote.sensoper.in server block.
#
# The website gets the front page, /shop/, /account/ and /assets/. Everything else (/login, /dashboard, /static/,
# /api/…) is still the ERP's. The files live in /var/www/sensoper-site (deploy-website.sh copies them there).
# Only `expires` here, no add_header, so any headers the ERP's server block sets still apply.

location = / {
    root /var/www/sensoper-site;
    try_files /index.html =404;      # not `index`: that would hand "/" back to the ERP's location /
    expires -1;
    gzip on;
}
location = /shop    { return 301 /shop/; }
location = /account { return 301 /account/; }
location ^~ /shop/ {
    root /var/www/sensoper-site;
    try_files $uri ${uri}index.html =404;
    expires -1;
    gzip on;
}
location ^~ /account/ {
    root /var/www/sensoper-site;
    try_files $uri ${uri}index.html =404;
    expires -1;
    gzip on;
}
location ^~ /assets/ {
    root /var/www/sensoper-site;
    try_files $uri =404;
    expires 30d;
    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 512;
    location ~* \.(css|js)$ { expires 1h; }
}

# Visitors' forms and customer logins. The address is set, not appended, so visitors can't fake it for the limits.
location ^~ /api/public/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}
location ^~ /api/client/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}

# Testimonial videos uploaded in the ERP (Website → Testimonials), up to 100 MB each.
location = /api/website/testimonials/video {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 110m;
    proxy_request_buffering off;      # stream it to the backend, which stops at 100 MB
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
