# Public website for Sensoper — sensoper.in, www.sensoper.in and shop.sensoper.in.
# Copy to /etc/nginx/sites-available/sensoper-website, link it into sites-enabled, then:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d sensoper.in -d www.sensoper.in -d shop.sensoper.in      (adds https and the redirects)
# The files live in /var/www/sensoper-site (website/deploy/deploy-website.sh copies them there).
# Only /api/public/* and /api/client/* reach the backend from these domains; the ERP stays on quote.sensoper.in.
# Never add a plain `location /api/ { proxy_pass … }` here. Keep the backend on 127.0.0.1 so X-Forwarded-For is trustworthy.

server {
    listen 80;
    server_name www.sensoper.in;
    return 301 https://sensoper.in$request_uri;
}

server {
    listen 80;
    server_name sensoper.in;
    root /var/www/sensoper-site;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ~* \.(woff2|webp|png|jpg|svg|ico)$ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
    location ~* \.(css|js)$ { expires 1h; add_header Cache-Control "public"; try_files $uri =404; }

    location = /shop  { return 301 https://shop.sensoper.in/; }
    location ^~ /shop/ { return 301 https://shop.sensoper.in/; }

    location ~ ^/api/(public|client)/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;     # set, not appended — visitors can't fake their address
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
    location /api/ { return 404; }       # plain prefix (not ^~) so the regex above still wins for /api/public and /api/client

    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    server_name shop.sensoper.in;
    root /var/www/sensoper-site;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = / { try_files /shop/index.html =404; }
    location ^~ /assets/ {
        location ~* \.(css|js)$ { expires 1h; add_header Cache-Control "public"; }
        expires 30d; add_header Cache-Control "public";
        try_files $uri =404;
    }
    location = /404.html { }
    location = /robots.txt { }
    location = /sitemap.xml { return 301 https://sensoper.in/sitemap.xml; }

    location ^~ /api/public/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
    location ^~ /api/ { return 404; }

    # anything else (e.g. /account/) belongs to the main site
    location / { return 301 https://sensoper.in$request_uri; }
}
