# shop.sensoper.in on its own address while the main site is still on quote.sensoper.in.
# Don't copy this by hand: website/deploy/enable-shop.sh fills in the backend port and the main site address,
# installs it as /etc/nginx/sites-available/sensoper-shop and runs certbot (which adds https to it).
# When sensoper.in moves to this server, nginx-sensoper-website.conf has its own shop block: run
# `enable-shop.sh --undo` first so the two don't clash.

server {
    listen 80;
    server_name shop.sensoper.in;
    root /var/www/sensoper-site;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = / { try_files /shop/index.html =404; expires -1; }
    location ^~ /shop/ { return 301 /; }          # shop.sensoper.in/shop/ is the same shop
    location ^~ /assets/ {
        location ~* \.(css|js)$ { expires 1h; add_header Cache-Control "public"; add_header X-Content-Type-Options nosniff always; }
        expires 30d;
        try_files $uri =404;
    }
    location = /robots.txt { }

    # the shop's own calls: products, pictures, orders, the site's settings
    location ^~ /api/public/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
    location ^~ /api/ { return 404; }

    # anything else (the home page, /account/, old links) belongs to the main site
    location / { return 301 __MAIN_SITE__$request_uri; }
}
